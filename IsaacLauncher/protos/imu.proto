syntax = "proto3";

import "Quaternion.proto";

package imu;

message Imu
{
  uint32 seq = 1;
  uint64 timestamp = 2;
  float linear_acceleration_x = 3;
  float linear_acceleration_y = 4;
  float linear_acceleration_z = 5;
  float anguldar_velocity_x = 6;
  float anguldar_velocity_y = 7;
  float anguldar_velocity_z = 8;
  foxglove.Quaternion orientation = 9;
  string ip = 10;
}