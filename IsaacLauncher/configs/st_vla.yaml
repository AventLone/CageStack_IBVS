# 1 车辆信息
vehicle:
  name : "ForkliftE"
  prim_path: "/World/forklift_E"
  cmd_topic: "ackermann_control_cmd"
  fork_joint_name: "lift_joint"
  drive_wheel_joint_names: ["left_front_wheel_joint", "right_front_wheel_joint"]
  steer_wheel_joint_names: ["left_rotator_joint", "right_rotator_joint"]

# 2 车轮配置
wheels:
  # 前轮配置(转向轮)
  front_left:
    prim_path: ""
    radius: 0.35  # 车轮半径(m)

# 3 货叉配置
forklift:
  prim_path: ""

# 4 传感器配置
sensors:
  # 4.1 激光雷达(用于避障和建图)
  lidar_0:
    type: "rtx_lidar"
    prim_path: ""
    params:

  lidar_1:
    type: "mid_360"
    prim_path: "/World/mid360"
    params:
      npy_path: "../configs/mid360.npy"
      sampling_hz: 200000
      min_range: 0.1
      max_range: 60
      batch_size: 20000
      draw_points: True
      draw_lines: False
      position: [-0.5,0.5,0.5]
      rotation: [0,0,180]


  # 4.2 摄像头(用于视觉识别)
  #水平分辨率的计算公式:HFOV=2×arctan(horizontal_aperture/(2×focal_length))
  #垂直分辨率的计算公式:VFOV=2×arctan(vertical_aperture/(2×focal_length))
  #focal_length_x = pixel_size * fx * 1e-6  # fx是内参矩阵中的水平焦距（像素单位），转换为米
  #focal_length_y = pixel_size * fy * 1e-6  # fy是内参矩阵中的垂直焦距（像素单位），转换为米
  #focal_length = (focal_length_x + focal_length_y) / 2  # 最终设置的平均焦距
  #horizontal_aperture = pixel_size * width * 1e-6  # convert to meters
  #vertical_aperture = pixel_size * height * 1e-6  # convert to meters

  fork_camera:
    type: "camera.rgb"
    prim_path: "/World/forklift_E/lift/fork_cmara"
    params:
      width: 1280
      height: 960
      fps: 20
      position: [ 1,1,1 ]                   #方位
      orientation: [ 0,0,0,1]                     #旋转
      camera_matrix: [[ 958.8, 0.0, 957.8], [0.0, 956.7, 589.5], [0.0, 0.0, 1.0 ]]                    #相机内参
      focus_distance: 1.5                   #焦距
      f_stop: 1.8                           #光圈值
      pixel_size: 3                     #像素大小
      distortion_way: "fish"                 #畸变方法   fish 鱼眼 pinhole 针孔
      clipping_range: [ 0.05,100000 ]      #设置裁剪范围
      distortion_coefficients: [ 0.05, 0.01, -0.003, -0.0005 ]
      set_focal_length: True
      set_hfov: 80




  front_camera:
    type: "camera.rgb"
    prim_path: "/World/forklift_E/body/body_camra_front"
    params:
      width: 1280
      height: 960
      fps: 20
      position: [1,1,1]                   #方位
      orientation:  [0,0,0,1]                     #旋转
      camera_matrix: [[958.8, 0.0, 957.8], [0.0, 956.7, 589.5], [0.0, 0.0, 1.0]]                    #相机内参
      focus_distance: 1.5                   #焦距
      f_stop: 1.8                           #光圈值
      pixel_size: 3                      #像素大小
      distortion_way:  "fish"                    #畸变方法
      clipping_range: [0.05,100000]      #设置裁剪范围
      distortion_coefficients: [0.05, 0.01, -0.003, -0.0005]
      set_focal_length: True
      set_hfov: 20


  top_camera:
    type: "camera.rgb"
    prim_path: "/World/forklift_E/body/body_camera_back"
    params:
      width: 1280
      height: 960
      fps: 20
      position: [ 1,1,1 ]                   #方位
      orientation: [ 0,0,0,1]                     #旋转
      camera_matrix: [ [ 958.8, 0.0, 957.8 ], [ 0.0, 956.7, 589.5 ], [ 0.0, 0.0, 1.0 ] ]                    #相机内参
      focus_distance: 1.5                   #焦距
      f_stop: 1.8                           #光圈值
      pixel_size: 3                       #像素大小
      distortion_way:                     #畸变方法
      clipping_range: [ 0.05,100000 ]      #设置裁剪范围
      distortion_coefficients: [ 0.05, 0.01, -0.003, -0.0005 ]
      set_focal_length: True
      set_hfov: 60



  # 4.3 IMU传感器(用于姿态估计)
  imu:
    type: "sensor.imu"
    prim_path: "/World/forklift_E/body/Imu_Sensor"
    params:
      sensor_name: "imu"
      translation: [0, 0, 0]
      orientation: [1, 0, 0, 0]
      frequency: 60
      linear_acceleration_filter_size: 10
      angular_velocity_filter_size: 10
      orientation_filter_size: 10




