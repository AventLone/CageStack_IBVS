syntax = "proto3";


import "Quaternion.proto";
import "Vector3.proto";
import "pose.proto";

package sim_data_flow;

message Testing_msg {
    // 节点信息
    string name = 1;
    foxglove.Vector3  translation = 2;
    foxglove.Quaternion rotation = 3;
}
  
message MTesting_msg 
{
    Pose robot_pose = 1;
    repeated Testing_msg msg_map = 2;
    uint64 timestamp = 3;
}